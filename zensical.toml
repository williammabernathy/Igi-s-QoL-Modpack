# The documentation site: docs/ built with Zensical and published to GitHub Pages by .github/workflows/pages.yml
# (docs/ci.md). Developer pages stay out of the site; pages it does publish link to them on GitHub.
[project]
site_name = "Vanguard Galaxy mechanics"
site_description = "How Vanguard Galaxy's combat, scaling, boarding, conquest and faction economy work, read from the game's code and ordered by when the game shows them."
site_url = "https://williammabernathy.github.io/Igi-s-QoL-Modpack/"
repo_url = "https://github.com/williammabernathy/Igi-s-QoL-Modpack"
repo_name = "Igi-s-QoL-Modpack"
exclude_docs = """
/building.md
/ci.md
/modding-reference.md
/template.md
/modpack/developing.md
/modpack/dev-harness.md
/modpack/sandbox-harness.md
"""
nav = [
  { "Home" = "index.md" },
  { "Basics" = [
    "mechanics/basics/README.md",
    "mechanics/basics/glossary.md",
    "mechanics/basics/combat-damage.md",
    "mechanics/basics/scaling.md",
    "mechanics/basics/stations.md",
    "mechanics/basics/boarding.md",
  ] },
  { "Conquest" = [
    "mechanics/conquest/README.md",
    "mechanics/conquest/glossary.md",
    "mechanics/conquest/war.md",
    "mechanics/conquest/sector-control.md",
    "mechanics/conquest/war-stations.md",
    "mechanics/conquest/faction-economy.md",
  ] },
  { "Beyond the Front" = [
    "mechanics/expansion/README.md",
    "mechanics/expansion/glossary.md",
    "mechanics/expansion/your-empire.md",
    "mechanics/expansion/empire-fleets.md",
  ] },
  { "Late game (spoilers)" = [
    "mechanics/late-game/README.md",
    "mechanics/late-game/glossary.md",
    "mechanics/late-game/umbral-reach.md",
    "mechanics/late-game/malcyte-and-meridia.md",
  ] },
  { "Modpack" = [
    "modpack/README.md",
    "modpack/features/interface.md",
    "modpack/features/echo.md",
    "modpack/features/fleet-combat.md",
    "modpack/features/loot-and-cargo.md",
    "modpack/features/stations.md",
    "modpack/features/logs-and-reference.md",
    "modpack/settings.md",
    "setup.md",
  ] },
]

[project.theme]
features = [
  "content.code.copy",
  "navigation.indexes",
  "navigation.tabs",
  "navigation.top",
  "search.highlight",
  "toc.follow",
]

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/sun"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/moon"
toggle.name = "Switch to dark mode"

[project.markdown_extensions]
attr_list = {}
tables = {}
toc.permalink = true
pymdownx.highlight = {}
pymdownx.superfences = {}
