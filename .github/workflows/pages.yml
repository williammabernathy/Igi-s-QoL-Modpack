# Builds docs/ into the documentation site (zensical.toml) and publishes it to GitHub Pages. It needs nothing from the
# game, so unlike ci.yml it runs on a GitHub-hosted runner.
name: Pages

on:
  push:
    branches: [main]
    paths:
      - docs/**
      - zensical.toml
      - tools/site/**
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: 3.x
      - run: pip install -r tools/site/requirements.txt
      - run: zensical build --clean --strict
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v5
